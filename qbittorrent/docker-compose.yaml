services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8123
      - TORRENTING_PORT=6881
    volumes:
      - ./config:/config
      - /mnt/fastmedia/torrents:/downloads
    ports:
      - "8123:8123"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent-https.rule=Host(`qbit.jedarabale.space`)"
      - "traefik.http.routers.qbittorrent-https.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent-https.tls.certresolver=cloudflare"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8123"
      # Add these for qBittorrent WebUI compatibility
      - "traefik.http.routers.qbittorrent-https.middlewares=qbittorrent-headers"
      - "traefik.http.middlewares.qbittorrent-headers.headers.referrerpolicy=no-referrer-when-downgrade"
      - "traefik.http.middlewares.qbittorrent-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    networks:
      - frontend
    restart: unless-stopped
networks:
  frontend:
    external: true
