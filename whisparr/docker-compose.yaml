# ─── Whisparr — Raspberry Pi 4B ─────────────────────────────────────────
# Access:
#   Local LAN    → http://<PI-LAN-IP>:6969
#   Public HTTPS → https://whisparr.jedarabale.space  (via Traefik)
#
# Media root folder inside Whisparr: /data/MEDIA/Adult
# Download folder inside Whisparr:   /data/torrents

services:
  whisparr:
    image: ghcr.io/hotio/whisparr:nightly
    container_name: whisparr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - UMASK=002
      - WEBUI_PORTS=6969/tcp
    volumes:
      - /home/homeserver/app_configs/whisparr_config:/config
      - /mnt/fastmedia:/data
    ports:
      - "6969:6969"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whisparr-https.rule=Host(`whisparr.jedarabale.space`)"
      - "traefik.http.routers.whisparr-https.entrypoints=websecure"
      - "traefik.http.routers.whisparr-https.service=whisparr"
      - "traefik.http.routers.whisparr-https.tls.certresolver=cloudflare"
      - "traefik.http.services.whisparr.loadbalancer.server.port=6969"
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    external: true
