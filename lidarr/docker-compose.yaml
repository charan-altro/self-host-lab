# ─── Lidarr — Raspberry Pi 4B ─────────────────────────────────────────
# Access:
#   Local LAN    → http://<PI-LAN-IP>:8686
#   Public HTTPS → https://lidarr.jedarabale.space  (via Traefik)
#
# Music root folder inside Lidarr: /data/MEDIA/Music
# Download folder inside Lidarr:   /data/torrents

services:
  lidarr:
    image: ghcr.io/hotio/lidarr
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - UMASK=002
      - WEBUI_PORTS=8686/tcp
    volumes:
      - /home/homeserver/app_configs/lidarr_config:/config
      - /mnt/fastmedia:/data
    ports:
      - "8686:8686"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr-https.rule=Host(`lidarr.jedarabale.space`)"
      - "traefik.http.routers.lidarr-https.entrypoints=websecure"
      - "traefik.http.routers.lidarr-https.service=lidarr"
      - "traefik.http.routers.lidarr-https.tls.certresolver=cloudflare"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    external: true
