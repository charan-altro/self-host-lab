networks:
  frontend:
    external: true
  backend:
    external: true


services:
  secure-cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: secure-cloudflare-tunnel
    hostname: cloudflare-tunnel
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    networks:
      - frontend
      - backend
    command: tunnel --no-autoupdate run
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/hosts:/etc/hosts
    environment:
      - "TUNNEL_TOKEN=${SECURE_CLOUDFLARE_TUNNEL_TOKEN}"
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
