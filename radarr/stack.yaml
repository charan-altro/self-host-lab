version: '3.8'

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /home/homeserver/app_configs/radarr_config:/config
      - /mnt/fastmedia:/data
      - /mnt/fastmedia/torrents:/downloads
    ports:
      - target: 7878
        published: 7878
        protocol: tcp
        mode: ingress
    networks:
      - proxy-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.radarr-https.rule=Host(`radarr.jedarabale.space`)"
        - "traefik.http.routers.radarr-https.entrypoints=websecure"
        - "traefik.http.routers.radarr-https.service=radarr-service"
        - "traefik.http.routers.radarr-https.tls.certresolver=cloudflare"
        - "traefik.http.services.radarr-service.loadbalancer.server.port=7878"

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /home/homeserver/app_configs/maintainerr_config:/opt/data
    ports:
      - target: 6246
        published: 6246
        protocol: tcp
        mode: ingress
    networks:
      - proxy-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.maintainerr-https.rule=Host(`maintainerr.jedarabale.space`)"
        - "traefik.http.routers.maintainerr-https.entrypoints=websecure"
        - "traefik.http.routers.maintainerr-https.service=maintainerr-service"
        - "traefik.http.routers.maintainerr-https.tls.certresolver=cloudflare"
        - "traefik.http.services.maintainerr-service.loadbalancer.server.port=6246"

networks:
  proxy-net:
    external: true
