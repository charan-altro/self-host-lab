# ─── Radarr — Raspberry Pi 4B ─────────────────────────────────────────
# Access:
#   Local LAN    → http://<PI-LAN-IP>:7878
#   Tailscale    → http://<PI-TAILSCALE-IP>:7878  (if Tailscale on host)
#   Public HTTPS → https://radarr.jedarabale.space  (via Traefik)

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /home/homeserver/app_configs/radarr_config:/config
      # Mount the parent drive to /data so Radarr can access media:
      # /data/MEDIA/Movies
      - /mnt/fastmedia:/data
      # Mount torrents path
      - /mnt/fastmedia/torrents:/downloads
    ports:
      - "7878:7878"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr-https.rule=Host(`radarr.jedarabale.space`)"
      - "traefik.http.routers.radarr-https.entrypoints=websecure"
      - "traefik.http.routers.radarr-https.service=radarr"
      - "traefik.http.routers.radarr-https.tls.certresolver=cloudflare"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    networks:
      - frontend
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /home/homeserver/app_configs/maintainerr_config:/opt/data
    ports:
      - "6246:6246"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintainerr-https.rule=Host(`maintainerr.jedarabale.space`)"
      - "traefik.http.routers.maintainerr-https.entrypoints=websecure"
      - "traefik.http.routers.maintainerr-https.service=maintainerr"
      - "traefik.http.routers.maintainerr-https.tls.certresolver=cloudflare"
      - "traefik.http.services.maintainerr.loadbalancer.server.port=6246"
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    external: true
