# ─── Seerr — Raspberry Pi 4B ─────────────────────────────────────────
# Access:
#   Local LAN    → http://<PI-LAN-IP>:5055
#   Tailscale    → http://<PI-TAILSCALE-IP>:5055  (if Tailscale on host)
#   Public HTTPS → https://requests.jedarabale.space  (via Traefik)

services:
  seerr:
    image: seerr/seerr:latest
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Asia/Kolkata
    ports:
      - "5055:5055"
    volumes:
      - /home/homeserver/app_configs/seerr_config:/app/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr-https.rule=Host(`requests.jedarabale.space`)"
      - "traefik.http.routers.seerr-https.entrypoints=websecure"
      - "traefik.http.routers.seerr-https.service=seerr"
      - "traefik.http.routers.seerr-https.tls.certresolver=cloudflare"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    external: true
