version: '3.8'

services:
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    hostname: ${HOSTNAME}
    networks:
      - monitoring
      - frontend
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /sys/class/thermal:/sys/class/thermal:ro  # Pi temps
      - netdata_data:/var/lib/netdata
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN}  # Optional cloud
      - PGID=1000  # Your group ID
      - memory.dedicated=20M  # Pi-optimized
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`netdata.${DOMAIN}`)"
      - "traefik.http.routers.netdata.entrypoints=websecure"
      - "traefik.http.routers.netdata.tls.certresolver=cloudflare"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 50M
        reservations:
          memory: 20M
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    networks:
      - monitoring
      - frontend
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`beszel.${DOMAIN}`)"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    networks:
      - monitoring
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - HUB_URL=http://beszel:8090
      - TOKEN=${BEZSEL_TOKEN}      # ← From .env
      - KEY=${BEZSEL_KEY}          # ← From .env
    depends_on:
      - beszel
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  frontend:
    external: true

volumes:
  netdata_data:
  beszel_data:
  beszel_agent:
