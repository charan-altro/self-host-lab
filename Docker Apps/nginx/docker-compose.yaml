services:
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./config/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"

      # HTTP router (port 80) - redirects to HTTPS
      #- "traefik.http.routers.nginx-http.rule=Host(`nginx.jedarabale`)"
      #- "traefik.http.routers.nginx-http.entrypoints=web"
      #- "traefik.http.routers.nginx-http.service=nginx"
      # HTTPS router (port 443) - Cloudflare TLS
      - "traefik.http.routers.nginx-https.rule=Host(`nginx.jedarabale.space`)"
      - "traefik.http.routers.nginx-https.entrypoints=websecure"
      - "traefik.http.routers.nginx-https.service=nginx"
      - "traefik.http.routers.nginx-https.tls.certresolver=cloudflare"
      # Service definition (shared by both routers)
      - "traefik.http.services.nginx.loadbalancer.server.port=80"
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    external: true
