version: '3.8'
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    ports:
      - target: 8096
        published: 8096
        protocol: tcp
        mode: ingress
    devices:
      - /dev/vchiq:/dev/vchiq
      - /dev/video10:/dev/video10
      - /dev/video11:/dev/video11
      - /dev/video12:/dev/video12
    volumes:
      - /home/homeserver/app_configs/jellyfin_config:/config
      - type: tmpfs
        target: /cache
        tmpfs:
          size: 2147483648
      - type: tmpfs
        target: /transcode
        tmpfs:
          size: 2147483648
      - /mnt/fastmedia/MEDIA/Movies:/media/movies:ro
      - /mnt/fastmedia/MEDIA/TVShows:/media/tv:ro
      - /mnt/fastmedia/MEDIA/Music:/media/music:ro
      - /mnt/fastmedia/torrents:/downloads_torrent
      - /mnt/fastmedia/MEDIA/Porn:/media/AdultVideos:ro
      - /mnt/fastmedia:/data:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    networks:
      - proxy-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.jellyfin-https.rule=Host(`jellypin.jedarabale.space`)"
        - "traefik.http.routers.jellyfin-https.entrypoints=websecure"
        - "traefik.http.routers.jellyfin-https.service=jellyfin-service"
        - "traefik.http.routers.jellyfin-https.tls.certresolver=cloudflare"
        - "traefik.http.services.jellyfin-service.loadbalancer.server.port=8096"

networks:
  proxy-net:
    external: true
