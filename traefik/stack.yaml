version: '3.8'

services:
  traefik:
    image: traefik:v3.6.5
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      - target: 8080
        published: 8080
        mode: ingress
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_token
      - DOCKER_API_VERSION=1.52
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/homeserver/PROD/traefik/config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - /home/homeserver/PROD/traefik/config/conf/:/etc/traefik/conf/:ro
      - /home/homeserver/PROD/traefik/config/certs/:/etc/traefik/certs/
    networks:
      - proxy-net
    secrets:
      - cf_dns_token
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik.rule=Host(`traefik.jedarabale.space`)"
        - "traefik.http.routers.traefik.entrypoints=websecure"
        - "traefik.http.routers.traefik.service=api@internal"
        - "traefik.http.routers.traefik.tls.certresolver=cloudflare"
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"

networks:
  proxy-net:
    external: true

secrets:
  cf_dns_token:
    external: true
