version: '3.8'
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /home/homeserver/app_configs/prowlarr_config:/config
    ports:
      - target: 9696
        published: 9696
        protocol: tcp
        mode: ingress
    networks:
      - proxy-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prowlarr-https.rule=Host(`prowlarr.jedarabale.space`)"
        - "traefik.http.routers.prowlarr-https.entrypoints=websecure"
        - "traefik.http.routers.prowlarr-https.service=prowlarr-service"
        - "traefik.http.routers.prowlarr-https.tls.certresolver=cloudflare"
        - "traefik.http.services.prowlarr-service.loadbalancer.server.port=9696"

networks:
  proxy-net:
    external: true
